interface:
  display_name: "Blog—ORS—V2.4.5"
  short_description: "SEO/GEO写作、Word审核、自然内链与Shopify安全发布"
  default_prompt: "请使用 $origin-sculpture-blog。首次安装或版本更新后先运行 scripts/self_test.py，未返回 PASS 不得处理生产文章。接收英文选题后确定 Pillar/Supporting 和 site-led/expert-led；每篇选择 2–3 张直接相关的 Origin 站内产品/项目原图并统一转为 1600×900 PNG/WebP，其余以通过视觉 QA 的 AI 场景图为主；按真实经验、自然内链和客户可读性规则生成最终上传版 Word。Word 必须由统一脚本生成，嵌入 Libre Baskerville 与 Poppins，使用最新全黑 Origin 格式并通过结构与逐页视觉校验。只有收到当前哈希的精确确认码后才能创建或更新 Shopify 文章。"
